<title>Missão Prova: Engenharia de Software</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2ff;--ink:#1a1c3a;--card:#fff;--a:#3b5bdb;--ok:#2f9e44;--no:#e03131;--gold:#f59f00;--soft:#dbe4ff}

*{box-sizing:border-box}

<script>
const P=[
{i:"🏗️",t:"Modelos tradicionais",learn:[
["O que são modelos de desenvolvimento","Abordagens usadas para organizar como o software é planejado, construído, testado e entregue. Servem para organizar o processo, reduzir riscos e retrabalho, ajudar na escolha da melhor abordagem e orientar entregas e expectativas. Pegadinha: modelo NÃO é o mesmo que ciclo de vida. O modelo explica a abordagem; o ciclo de vida mostra as fases. Não existe modelo melhor em absoluto: a escolha depende do contexto, do tipo de projeto, dos riscos e dos requisitos. Qual modelo usar: requisitos fixos e bem definidos → Cascata; produto em evolução → Iterativo; entregas por módulos/partes → Incremental; projeto crítico e complexo → Espiral; startup ou mudanças constantes → Ágil."],
["Cascata","Linear e sequencial: cada fase termina por completo antes da próxima. Etapas: Requisitos, Análise, Projeto, Implementação, Testes, Manutenção. Vantagens: simples, boa rastreabilidade, documentação forte. Desvantagens: rigidez, feedback tardio, retrabalho e mudanças caras. Use com requisitos bem definidos, escopo estável e projetos regulados. Ex.: folha de pagamento. Pegadinha: Cascata não é ausência de testes ou planejamento; o problema é a baixa flexibilidade."],
["Iterativo","Desenvolve por ciclos sucessivos com revisão a cada ciclo. Ciclo: Planejar, Desenvolver, Avaliar, Ajustar, Repetir. Vantagens: flexibilidade e adaptação constante. Desvantagens: escopo mal controlado e risco de prolongar o projeto. Use quando o problema ainda não é bem compreendido e os requisitos mudam. Pegadinha: iterativo não é entregar módulos grandes e independentes; o foco é revisar, aprender e evoluir o produto."],
["Incremental","Entrega o sistema em partes funcionais (incrementos), e cada parte já agrega valor. Começa com planejamento geral, constrói o incremento 1, entrega, constrói o 2, e assim por diante. Vantagens: valor antecipado, feedback cedo. Desvantagens: exige boa arquitetura e planejamento dos módulos. Ex.: e-commerce por módulos (cadastro, carrinho, cupons). Diferença-chave: incremental = entrega por partes; iterativo = revisões cíclicas de um todo."],
["Espiral","Orientado a riscos, em ciclos. Quatro atividades por ciclo: 1) planejamento e objetivos, 2) identificação e análise de riscos, 3) desenvolvimento e validação, 4) avaliação e planejamento do próximo ciclo. Quanto maior o risco, maior a necessidade de tratá-lo antes de avançar. Vantagens: riscos tratados cedo, útil em projetos críticos. Desvantagens: maior custo, gestão complexa, exige experiência, excessivo para projetos simples. Associe Espiral a análise de riscos."]],
qs:[
["Explique a diferença entre modelo de desenvolvimento e ciclo de vida de software.","O modelo de desenvolvimento é a abordagem ou estrutura usada para organizar como o software será planejado, construído, testado e entregue. O ciclo de vida mostra as fases pelas quais o software passa. Os dois não são a mesma coisa.",["Modelo = abordagem/estrutura de organização","Ciclo de vida = fases","Deixa claro que não são sinônimos"]],
["Descreva o Modelo Cascata: etapas, vantagens, desvantagens e quando usar.","Modelo sequencial e linear em que cada fase termina antes da próxima: Requisitos, Análise, Projeto, Implementação, Testes e Manutenção. Vantagens: simples, boa rastreabilidade e documentação forte. Desvantagens: rigidez, feedback tardio e mudanças caras. Indicado com requisitos estáveis e bem definidos, escopo estável e projetos regulados.",["Sequencial/linear, uma fase termina antes da outra","Citou as etapas na ordem","Vantagens e desvantagens","Usar quando os requisitos são estáveis"]],
["Diferencie o modelo Incremental do Iterativo e dê um exemplo de cada.","Incremental entrega o sistema em partes funcionais, e cada incremento já agrega valor (ex.: e-commerce por módulos: cadastro, carrinho, cupons). Iterativo faz revisões cíclicas de um todo, evoluindo o produto a cada ciclo com feedback (ex.: plataforma que começa com funções básicas e recebe novas a cada ciclo).",["Incremental = entrega por partes","Iterativo = revisões cíclicas de um todo","Exemplo de cada um"]],
["Por que o Modelo Espiral é associado a projetos críticos e complexos?","Porque é orientado a riscos: em cada ciclo há identificação e análise de riscos e definição de mitigação antes de avançar. Isso é útil em projetos grandes, críticos e com tecnologias novas. Em contrapartida, tem maior custo e complexidade de gestão.",["Orientado a riscos","Análise de riscos em cada ciclo","Citou custo/complexidade como contrapartida"]]]},
{i:"🏃",t:"Ágil e Scrum",learn:[
["Desenvolvimento Ágil","Abordagem baseada em ciclos curtos, feedback frequente e adaptação. Objetivo: entregar valor cedo, receber feedback rápido, responder melhor às mudanças e aumentar a colaboração. Quatro ideias-chave: pessoas e colaboração, software funcionando, proximidade com o cliente, adaptação a mudanças. Ágil NÃO é método único: é uma forma de pensar e trabalhar, que pode ser materializada por Scrum, Kanban e XP. Pegadinha: ágil não significa ausência de documentação, planejamento ou arquitetura. Mudanças de requisitos não são necessariamente um problema."],
["Scrum: o que é","Framework ágil para desenvolver produtos complexos, com trabalho organizado em Sprints e foco em inspeção, adaptação e transparência. Sprint: período de duração fixa (geralmente 1 a 4 semanas) para gerar um incremento 'Pronto'. Scrum Team: Product Owner + Scrum Master + Developers, um time multifuncional. Pegadinha: Scrum não tem 'Gerente de Projeto' oficial."],
["Papéis, eventos e artefatos","Product Owner: maximiza o valor do produto e gerencia/prioriza o Product Backlog. Scrum Master: ajuda a entender e aplicar o Scrum e remove impedimentos. Developers: constroem o incremento. Eventos: Sprint, Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective. Artefatos: Product Backlog, Sprint Backlog, Increment. Compromissos: Product Goal, Sprint Goal, Definition of Done."],
["Não confunda","Daily Scrum: voltada aos Developers, serve para inspecionar o progresso rumo ao Sprint Goal e adaptar o plano. Sprint Review: foca no produto/resultado e próximos passos, com feedback dos stakeholders. Sprint Retrospective: foca no processo, na interação e na melhoria da forma de trabalho. Sprint Goal é definido na Sprint Planning."]],
qs:[
["Por que Ágil não é um método único? Cite exemplos que o materializam.","Ágil é uma forma de pensar e trabalhar, baseada em ciclos curtos, feedback e adaptação, e não um método específico. Pode ser materializado por métodos e frameworks como Scrum, Kanban e XP.",["Ágil é forma de pensar/trabalhar","Não é um método único","Citou Scrum, Kanban ou XP"]],
["Descreva os papéis do Scrum Team e a responsabilidade de cada um.","O Scrum Team é formado por Product Owner, Scrum Master e Developers. O PO maximiza o valor do produto e gerencia e prioriza o Product Backlog. O Scrum Master ajuda o time e a organização a compreender e aplicar o Scrum e remove impedimentos. Os Developers constroem o incremento.",["Citou os 3 papéis","Função do Product Owner","Função do Scrum Master","Função dos Developers"]],
["Diferencie Sprint Review de Sprint Retrospective.","A Sprint Review apresenta o incremento e coleta feedback dos stakeholders, focando em produto, resultado e próximos passos. A Sprint Retrospective é uma reflexão do time sobre o que funcionou e o que pode melhorar, focando em processo, interação e forma de trabalho.",["Review = produto/resultado e feedback","Retrospective = processo/melhoria do time","Diferença de foco clara"]],
["Quais são os artefatos do Scrum e o que cada um representa?","Product Backlog: lista ordenada de tudo que pode trazer valor ao produto. Sprint Backlog: trabalho selecionado do Product Backlog para a Sprint. Increment: resultado concreto do trabalho da Sprint, 'Pronto'. Cada um se relaciona a um compromisso: Product Goal, Sprint Goal e Definition of Done.",["Product Backlog","Sprint Backlog","Increment","Relacionou aos compromissos (opcional)"]]]},
{i:"📋",t:"Kanban e XP",learn:[
["Kanban","Método de gestão visual do fluxo de trabalho. Objetivo: visualizar o trabalho, identificar gargalos, reduzir acúmulo, melhorar o fluxo e aumentar a previsibilidade. Quadro: A Fazer, Em Andamento, Concluído. Práticas: visualizar o fluxo, limitar trabalho em andamento, gerenciar o fluxo, tornar políticas explícitas, usar feedback, melhorar continuamente. WIP é o limite de trabalho simultâneo. Sistema puxado: novo item só inicia se há capacidade. Pegadinha: Kanban não é só um quadro de post-its."],
["Kanban x Scrum","Kanban: fluxo contínuo e limites de WIP muito característicos. Scrum: trabalho estruturado em Sprints, com responsabilidades e eventos formalmente definidos. Kanban permite adaptação sem grandes mudanças estruturais."],
["Extreme Programming (XP)","Abordagem ágil que enfatiza práticas técnicas para produzir software de qualidade em ambientes sujeitos a mudanças. Práticas: programação em pares, TDD, integração contínua, refatoração, pequenas releases, design simples, propriedade coletiva do código, cliente próximo. Valores: comunicação, simplicidade, feedback, coragem e respeito. XP = agilidade com forte disciplina técnica."],
["TDD e refatoração","TDD em três passos: Red (escrever teste que falha), Green (implementar o mínimo para passar), Refactor (melhorar o código). Refatoração melhora a estrutura interna sem alterar o comportamento externo. Pegadinha: refatoração não é adicionar funcionalidades. Integração contínua: integrar com frequência e validar com testes automáticos para detectar problemas cedo."]],
qs:[
["O que é WIP no Kanban e por que limitá-lo?","WIP (Work in Progress) é o limite da quantidade de trabalho que pode estar em execução simultaneamente. Limitar evita excesso de trabalho simultâneo, reduz acúmulo, ajuda a identificar gargalos e melhora o fluxo.",["Define WIP como limite de trabalho em andamento","Cita evitar excesso/acúmulo","Cita gargalos ou fluxo"]],
["Compare Kanban e Scrum.","Kanban é um método de gestão visual com fluxo contínuo e limites de WIP. Scrum é um framework com trabalho estruturado em Sprints e papéis, eventos e artefatos formalmente definidos. Ambos são ágeis.",["Kanban: fluxo contínuo e WIP","Scrum: Sprints e papéis/eventos definidos","Comparação direta entre os dois"]],
["Explique o ciclo do TDD.","Red: escrever um teste que falha. Green: implementar o mínimo de código para passar no teste. Refactor: melhorar o código mantendo o comportamento. O ciclo se repete.",["Red: teste que falha","Green: mínimo para passar","Refactor: melhorar o código"]],
["Cite quatro práticas do XP e explique duas delas.","Práticas: programação em pares, TDD, integração contínua, refatoração, pequenas releases, design simples, propriedade coletiva e cliente próximo. Ex.: na programação em pares, uma pessoa codifica e a outra acompanha e revisa, alternando papéis. Na integração contínua, as alterações são integradas com frequência e validadas por testes automáticos.",["Citou 4 práticas","Explicou uma corretamente","Explicou a segunda corretamente"]]]},
{i:"📝",t:"Requisitos: base",learn:[
["Engenharia de Requisitos","Conjunto de atividades para descobrir, analisar, documentar, validar e gerenciar o que um sistema deve fazer e as restrições sob as quais deve operar. Requisito: necessidade, capacidade, condição ou restrição que deve ser atendida pelo sistema. Importância: reduzir ambiguidades, alinhar expectativas, evitar retrabalho, orientar o desenvolvimento e servir de base para testes."],
["Processo","1) Elicitação: descobrir necessidades dos stakeholders. 2) Análise: entender e organizar. 3) Especificação: documentar de forma clara e completa. 4) Validação: verificar se atendem às necessidades. 5) Gerenciamento: controlar mudanças e manter atualizados. Continua ao longo do projeto por meio do gerenciamento de mudanças."],
["Problemas comuns e stakeholder","Problemas: requisito incompleto, ambíguo, conflito entre interessados, mudança não controlada, falta de rastreabilidade. Stakeholder: pessoa, grupo ou organização interessada ou afetada pelo sistema/projeto. Rastreabilidade: capacidade de relacionar um requisito à sua origem, implementação, testes e mudanças."],
["Funcionais x não funcionais","Funcionais: o que o sistema deve fazer (cadastrar usuário, emitir relatório). Não funcionais: como ou sob quais condições ele deve funcionar (desempenho, segurança, disponibilidade, usabilidade, confiabilidade, portabilidade, interoperabilidade). Ex.: 'gerar boleto' é funcional; 'gerar boleto em até 3 segundos' é não funcional. Todo requisito não funcional deve ser verificável: 'o sistema deve ser rápido' é inadequado. Macete: funcional = faz; não funcional = qualidade/restrição. Regra de negócio pode influenciar ambos, conforme o contexto."]],
qs:[
["O que é Engenharia de Requisitos e quais são as etapas do seu processo?","Conjunto de atividades para descobrir, analisar, documentar, validar e gerenciar o que o sistema deve fazer e as restrições sob as quais deve operar. Etapas: elicitação, análise, especificação, validação e gerenciamento.",["Definição correta","Cinco etapas citadas","Ordem correta"]],
["Diferencie requisitos funcionais de não funcionais com exemplos.","Funcionais descrevem o que o sistema deve fazer (ex.: emitir relatório, autenticar cliente). Não funcionais descrevem como ou sob quais condições o sistema deve operar, ligados a qualidade e restrições (ex.: responder em até 2 segundos, autenticação multifator, alta disponibilidade).",["Funcional = o que faz","Não funcional = como/qualidade/restrição","Exemplo de cada"]],
["Por que um requisito como 'o sistema deve ser rápido' é inadequado?","Porque não é verificável: é vago e ambíguo. Requisitos não funcionais precisam ser mensuráveis, por exemplo 'responder em até 2 segundos', para poderem ser testados e validados.",["Aponta que é vago/ambíguo","Aponta que precisa ser verificável","Dá exemplo mensurável"]],
["Cite cinco problemas comuns em requisitos e a importância da Engenharia de Requisitos.","Problemas: requisito incompleto, ambíguo, conflito entre interessados, mudança não controlada, falta de rastreabilidade. Importância: reduz ambiguidades, alinha expectativas, evita retrabalho, orienta o desenvolvimento e serve de base para testes.",["Cinco problemas","Duas ou mais razões de importância","Relaciona a retrabalho ou testes"]]]},
{i:"🎤",t:"Elicitação",learn:[
["O que é","Descobrir e compreender requisitos junto às fontes de informação. É um processo contínuo de descoberta, exploração e compreensão das necessidades, e não apenas 'levantamento'. Participam: usuários, clientes, gestores, especialistas de domínio, equipe técnica e outros stakeholders."],
["Técnicas","Entrevistas: conversas estruturadas, aprofundam necessidades. Questionários: perguntas padronizadas, atingem muitas pessoas. Workshops: reuniões colaborativas, constroem entendimento conjunto. Brainstorming: geração livre de ideias sem julgamento. Observação: acompanhar o trabalho real. Análise de documentos: entender regras e processos existentes. Prototipação: modelos visuais para validar ideias, útil para esclarecer requisitos mal compreendidos. Cenários/casos de uso: descrevem situações reais e interações esperadas."],
["Desafios e pegadinha","Desafios: usuário não sabe expressar o que precisa, necessidades conflitantes, conhecimento tácito, comunicação ambígua e requisitos que mudam. Pegadinha: elicitação descobre requisitos; validação verifica se os requisitos registrados representam corretamente as necessidades. Resumo: perguntar, observar, analisar e validar entendimento."]],
qs:[
["O que é elicitação de requisitos e quem participa dela?","Processo contínuo de descobrir, explorar e compreender requisitos junto às fontes de informação. Participam usuários, clientes, gestores, especialistas de domínio, equipe técnica e outros stakeholders.",["Definição de descoberta e compreensão","Caráter contínuo","Cita participantes"]],
["Compare entrevistas, questionários e observação: quando cada uma ajuda mais?","Entrevistas ajudam a aprofundar necessidades. Questionários ajudam a atingir muitas pessoas. Observação ajuda a entender o trabalho real como ele acontece.",["Entrevista: aprofundar","Questionário: muitas pessoas","Observação: trabalho real"]],
["Quais são os principais desafios da elicitação?","Usuário que não sabe expressar o que precisa, necessidades conflitantes, conhecimento tácito, comunicação ambígua e requisitos que mudam ao longo do tempo.",["Três ou mais desafios corretos","Cita conhecimento tácito ou usuário que não sabe expressar","Cita mudanças ou conflitos"]],
["Diferencie elicitação de validação e explique como a prototipação ajuda.","Elicitação busca descobrir requisitos; validação verifica se os requisitos registrados representam corretamente as necessidades. A prototipação cria modelos visuais para explorar e validar ideias, esclarecendo requisitos mal compreendidos.",["Elicitação = descobrir","Validação = verificar","Prototipação esclarece/valida"]]]},
{i:"✅",t:"Validação e gestão",learn:[
["Validação","Garante que os requisitos estão corretos, completos, claros e controlados. Pergunta-chave: estamos descrevendo aquilo que o usuário realmente precisa? Verificação (VERIFICAP): validade, consistência, completude, realismo/viabilidade, ausência de ambiguidades e possibilidade de verificação. Técnicas: revisões, protótipos, geração de casos de teste e análise com stakeholders."],
["Gerenciamento","Controla os requisitos ao longo do projeto. Atividades: registrar mudanças, analisar impacto, controlar versões, manter rastreabilidade, priorizar e acompanhar status. Gestão de mudanças: Solicitação, Análise de impacto, Decisão, Atualização, Rastreamento."],
["Rastreabilidade e baseline","Rastreabilidade relaciona requisito com origem, implementação e teste, e ajuda a medir o impacto de alterações. Ex.: se o requisito R12 mudar, quais módulos e testes serão afetados? Baseline (linha de base): conjunto aprovado de requisitos que serve como referência oficial para controle de mudanças e acompanhamento. Mudança não é erro: requisitos podem evoluir, o importante é que as mudanças sejam avaliadas e controladas."]],
qs:[
["Diferencie validação de gerenciamento de requisitos.","Validação verifica se os requisitos refletem as necessidades corretas do usuário. Gerenciamento controla a evolução e as mudanças desses requisitos ao longo do projeto.",["Validação = necessidades corretas","Gerenciamento = evolução e mudanças","Diferença clara"]],
["Cite as técnicas de validação e os critérios de qualidade verificados.","Técnicas: revisões, protótipos, geração de casos de teste e análise com stakeholders. Critérios: validade, consistência, completude, realismo/viabilidade, ausência de ambiguidades e possibilidade de verificação.",["Duas ou mais técnicas","Três ou mais critérios","Pergunta-chave sobre o que o usuário precisa (opcional)"]],
["Explique o processo de gestão de mudanças em requisitos.","Solicitação de mudança, análise de impacto, decisão, atualização dos requisitos e rastreamento. A mudança não é vista como erro, mas deve ser avaliada e controlada de forma organizada.",["Cinco etapas na ordem","Análise de impacto","Mudança não é erro"]],
["O que são rastreabilidade e baseline, e qual a utilidade de cada uma?","Rastreabilidade é a capacidade de relacionar um requisito à sua origem, implementação, testes e mudanças, ajudando a medir o impacto de alterações. Baseline é o conjunto aprovado de requisitos, referência oficial para controlar mudanças e acompanhar o projeto.",["Define rastreabilidade","Utilidade: impacto de mudanças","Define baseline","Utilidade da baseline como referência"]]]}
];
const app=document.getElementById("app");
let M=null,S={xp:0,done:{}},cur=0,step=0,qi=0,mode="learn",pending=null,draft="",rp=0,queue=[],pos=0;
const R=[[[0],[1],[3],[4]],[[0],[1,2],[3],[2]],[[0],[1],[3],[2]],[[0,1],[3],[3],[0,2]],[[0],[1],[2],[1,2]],[[0,1],[0],[1],[2]]];
try{const s=localStorage.getItem("estudo1");if(s)S=JSON.parse(s)}catch(e){}
S.xa=S.xa||0;S.da=S.da||{};
function save(){try{localStorage.setItem("estudo1",JSON.stringify(S))}catch(e){}}
let total=P.reduce((a,p)=>a+p.qs.reduce((b,q)=>b+q[2].length*10,0),0);
function rank(){const r=(M==="a"?S.xa/TA:S.xp/total);return r>.85?"🏆 Mestre da Engenharia":r>.6?"🥇 Arquiteto de Software":r>.3?"🥈 Desenvolvedor Pleno":"🥉 Estagiário em treino"}
function hud(){return `<div class="hud"><span class="pill">⭐ ${M==="a"?S.xa:S.xp} XP</span><span class="pill">${rank()}</span></div>`}
function home(){if(!M)return modeSel();
const D=M==="a"?S.da:S.done,n=Object.keys(D).length;
app.innerHTML=hud()+`<h1>Missão Prova 🎯</h1><p>${M==="a"?"Modo alternativas: 6 fases. Leia o conteúdo e responda 8 perguntas de múltipla escolha por fase. Cada acerto vale 10 XP.":"Modo dissertativa: 6 fases, 6 perguntas cada. Responda com suas palavras e receba correção automática, ponto a ponto. Cada ponto vale 10 XP."}</p><div class="bar"><i style="width:${n/6*100}%"></i></div>`;
P.forEach((p,k)=>{const b=document.createElement("button");b.className="btn ph";const d=D[k];b.innerHTML=`<span class="big" style="font-size:2rem">${p.i}</span><span><b>Fase ${k+1}: ${p.t}</b>${d!=null?"✅ "+d+" XP":"Ainda não concluída"}</span>`;b.onclick=()=>{cur=k;step=0;qi=0;mode="learn";render()};app.appendChild(b)});const tm=document.createElement("button");tm.className="btn s";tm.textContent="Trocar modo (dissertativa/alternativas)";tm.onclick=()=>{M=null;home()};app.appendChild(tm);
}

function addXp(v){M==="a"?S.xa+=v:S.xp+=v}
function modeSel(){app.innerHTML=`<div class="c"><div class="big">🎯</div><h1>Missão Prova</h1><p>Escolha como quer treinar:</p></div><button class="btn" id="md">✍️ Dissertativa<br><small>Escreva a resposta e receba correção automática</small></button><button class="btn" id="ma">🔘 Alternativas<br><small>4 opções por pergunta, correção na hora</small></button>`;document.getElementById("md").onclick=()=>{M="d";home()};document.getElementById("ma").onclick=()=>{M="a";home()}}
async function tips(el,qt){el.innerHTML='<div class="ans">Preparando dicas...</div>';const cards=RR().map(k=>P[cur].learn[k]);let t=null;
try{const sm=await claude.use("sample");if(sm){const r=await sm.json(`Você é um tutor de Engenharia de Software. Conteúdo: ${JSON.stringify(cards)}\nPergunta da prova: ${qt}\nSugira 4 formas alternativas e práticas de estudar exatamente este conteúdo (mnemônico, analogia do dia a dia, esquema para desenhar, explicar em voz alta, tabela comparativa), cada uma aplicada ao assunto, com no máximo 2 frases, em português. Não revele a resposta da pergunta. Responda somente JSON: {"dicas":["...","...","...","..."]}`,{modelTier:"quick"});if(r&&Array.isArray(r.dicas))t=r.dicas}}catch(e){}
if(!t){const c=cards[0][0];t=["Feche o conteúdo e explique \""+c+"\" em voz alta, como se ensinasse um colega.","Desenhe um esquema ou mapa mental de \""+c+"\" só com palavras-chave.","Crie um mnemônico com as iniciais das etapas ou termos principais.","Monte uma tabela de 2 colunas comparando com o conceito mais parecido: diferenças e quando usar cada um."]}
el.innerHTML=`<div class="ans"><b>💡 Dicas de estudo</b>${t.map(x=>`<p>• ${String(x).replace(/</g,"&lt;")}</p>`).join("")}</div>`}
function maAsk(){
const p=P[cur],q=p.mq[qi],n=p.mq.length,d=Object.keys(p.log).length,rem=queue.length-pos;
if(!p.ord[qi])p.ord[qi]=[0,1,2,3].sort(()=>Math.random()-.5);
const o=p.ord[qi];
app.innerHTML=hud()+`<div class="bar"><i style="width:${d/n*100}%"></i></div><div class="card"><p class="tag">${p.i} Pergunta ${d+1}/${n}${p.sk[qi]?" • pulada antes":""}</p><h2>${q[0]}</h2><div id="op">${o.map((k,j)=>`<button class="btn s op" data-k="${k}" style="text-align:left">${"ABCD"[j]}) ${q[1][k]}</button>`).join("")}</div><div id="fx"></div><div id="ac"><button class="btn s" id="dk">💡 Dica de estudo</button>${rem>1?'<button class="btn s" id="sk">⏭️ Pular por enquanto</button>':""}<button class="btn s" id="ns">🤷 Não sei (conta como erro)</button></div><div id="dc"></div></div><button class="btn s" id="r">Reler a explicação desta pergunta</button>`;
document.querySelectorAll(".op").forEach(b=>b.onclick=()=>{
const k=+b.dataset.k,ok=k===q[2];
document.querySelectorAll(".op").forEach(x=>{x.disabled=true;if(+x.dataset.k===q[2]){x.style.background="var(--ok)";x.style.color="#fff"}});
if(!ok){b.style.background="var(--no)";b.style.color="#fff"}
document.getElementById("ac").style.display="none";document.getElementById("dc").innerHTML="";
addXp(ok?10:0);p.tmp+=ok?10:0;p.log[qi]={g:ok?1:0,st:ok?"ok":"err"};save();
document.getElementById("fx").innerHTML=`<div class="ans"><p class="tag" style="font-size:1.2rem">${ok?"✅ Correta! +10 XP":"❌ Errada"}</p><p>${q[3]}</p></div><button class="btn" id="c">${pos+1>=queue.length?"Ver resultado da fase":"Próxima pergunta"}</button>`;
document.getElementById("c").onclick=nextQ});
document.getElementById("dk").onclick=()=>tips(document.getElementById("dc"),q[0]);
if(rem>1)document.getElementById("sk").onclick=()=>{p.sk[qi]=1;queue.push(qi);nextQ()};
document.getElementById("ns").onclick=()=>{p.log[qi]={g:0,st:"ns"};nextQ()};
document.getElementById("r").onclick=()=>{rp=0;mode="re";render()};window.scrollTo(0,0)}
function maRes(){
const p=P[cur],mx=p.mq.length*10,r=p.tmp/mx,L=Object.entries(p.log);
const c=k=>L.filter(x=>x[1].st===k).length,bad=L.filter(x=>x[1].st!=="ok");
app.innerHTML=hud()+`<div class="card c"><div class="big">${r>.85?"⭐⭐⭐":r>.5?"⭐⭐":"⭐"}</div><h1>Fase ${cur+1} concluída</h1><p>${p.tmp} de ${mx} XP</p><p>✅ ${c("ok")} corretas • ❌ ${c("err")} erradas • 🤷 ${c("ns")} não sei</p><p>${r>.85?"Você domina este conteúdo.":r>.5?"Bom, mas revise os erros abaixo.":"Vale reler o conteúdo e repetir a fase."}</p></div>`;
if(bad.length)app.insertAdjacentHTML("beforeend",`<div class="card"><h2>Erros para revisar (${bad.length})</h2>${bad.map(([k,v])=>`<p><b>${p.mq[k][0]}</b><br>${v.st==="ns"?"🤷 Não sei (contou como erro)":"❌ Errada"}</p><div class="ans"><b>Correta:</b> ${p.mq[k][1][p.mq[k][2]]}<br>${p.mq[k][3]}</div>`).join("")}</div>`);
app.insertAdjacentHTML("beforeend",`${cur<5?'<button class="btn" id="nx">Próxima fase</button>':""}<button class="btn s" id="rp">Repetir esta fase</button><button class="btn s" id="hm">Mapa de fases</button>`);
if(cur<5)document.getElementById("nx").onclick=()=>{cur++;step=0;mode="learn";render()};
document.getElementById("rp").onclick=()=>{addXp(-p.tmp);step=0;mode="learn";render()};
document.getElementById("hm").onclick=home;window.scrollTo(0,0)}
function fallback(t,q){const a=t.toLowerCase();return q[2].map(k=>{const w=k.toLowerCase().split(/[^a-zà-ú0-9]+/).filter(x=>x.length>=5);if(!w.length)return false;return w.filter(x=>a.includes(x.slice(0,Math.max(4,x.length-2)))).length/w.length>=.4})}
async function grade(){
const p=P[cur],q=p.qs[qi];
app.innerHTML=hud()+`<div class="card c"><div class="big">🧠</div><h2>Corrigindo sua resposta...</h2></div>`;
let ok=null,com="";
try{const sm=await claude.use("sample");if(sm){const r=await sm.json(`Você é um professor corrigindo uma prova discursiva de Engenharia de Software. Seja justo: aceite sinônimos e paráfrases, mas não dê o ponto se a ideia estiver ausente ou errada.\nPergunta: ${q[0]}\nResposta modelo: ${q[1]}\nPontos a avaliar: ${JSON.stringify(q[2])}\nResposta do aluno: ${pending.t}\nResponda somente JSON: {"acertos":[true/false para cada ponto, na mesma ordem e quantidade],"comentario":"1 ou 2 frases em português dizendo o que faltou ou errou, ou elogiando"}`,{modelTier:"quick",cache:false});if(r&&Array.isArray(r.acertos)&&r.acertos.length===q[2].length){ok=r.acertos.map(Boolean);com=r.comentario||""}}}catch(e){}
if(!ok){ok=fallback(pending.t,q);com="Correção automática simplificada (sem IA disponível): confira a resposta modelo."}
pending.ok=ok;pending.com=com;mode="fb";render()}
function feedback(){
const p=P[cur],q=p.qs[qi],ok=pending.ok,g=ok.filter(Boolean).length,r=g/ok.length;
const st=r>=.8?"ok":g>0?"par":"err",B={ok:"✅ Correta",par:"🟡 Parcialmente correta",err:"❌ Errada"};
app.innerHTML=hud()+`<div class="card"><h2>${q[0]}</h2><p class="tag" style="font-size:1.25rem">${B[st]}</p><p><b>Sua resposta:</b> ${pending.t.replace(/</g,"&lt;")}</p><p><b>+${g*10} XP</b> (${g} de ${ok.length} pontos)</p>${q[2].map((k,j)=>`<p>${ok[j]?"✅":"❌"} ${k}</p>`).join("")}${pending.com?`<div class="ans"><b>Comentário do professor</b><p>${pending.com.replace(/</g,"&lt;")}</p></div>`:""}<div class="ans"><b>Resposta modelo</b><p>${q[1]}</p></div><button class="btn" id="c">${pos+1>=queue.length?"Ver resultado da fase":"Próxima pergunta"}</button></div>`;
document.getElementById("c").onclick=()=>{S.xp+=g*10;p.tmp+=g*10;p.log[qi]={g,st};save();nextQ()};window.scrollTo(0,0)}
function result(){
const p=P[cur],max=p.qs.reduce((a,q)=>a+q[2].length*10,0),r=p.tmp/max,L=Object.entries(p.log);
const c=k=>L.filter(x=>x[1].st===k).length,bad=L.filter(x=>x[1].st==="err"||x[1].st==="ns");
const stars=r>.85?"⭐⭐⭐":r>.5?"⭐⭐":"⭐";
app.innerHTML=hud()+`<div class="card c"><div class="big">${stars}</div><h1>Fase ${cur+1} concluída</h1><p>${p.tmp} de ${max} XP</p><p>✅ ${c("ok")} corretas • 🟡 ${c("par")} parciais<br>❌ ${c("err")} erradas • 🤷 ${c("ns")} não sei</p><p>${r>.85?"Você domina este conteúdo.":r>.5?"Bom, mas releia os pontos que faltaram.":"Vale reler o conteúdo e repetir a fase."}</p></div>`;
if(bad.length)app.insertAdjacentHTML("beforeend",`<div class="card"><h2>Erros para revisar (${bad.length})</h2>${bad.map(([k,v])=>`<p><b>${p.qs[k][0]}</b><br>${v.st==="ns"?"🤷 Não sei (contou como erro)":"❌ Errada"}</p><div class="ans">${p.qs[k][1]}</div>`).join("")}</div>`);
app.insertAdjacentHTML("beforeend",`${cur<5?'<button class="btn" id="nx">Próxima fase</button>':""}<button class="btn s" id="rp">Repetir esta fase</button><button class="btn s" id="hm">Mapa de fases</button>`);
if(cur<5)document.getElementById("nx").onclick=()=>{cur++;step=0;mode="learn";render()};
document.getElementById("rp").onclick=()=>{addXp(-p.tmp);step=0;mode="learn";render()};
document.getElementById("hm").onclick=home;window.scrollTo(0,0)}
home();
</script></body></html>
